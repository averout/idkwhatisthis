<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Компас — туры по России</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">КОМПАС</div>
    <nav class="nav">
      <a href="#tours">Туры</a>
      <a href="#booking">Заявка</a>
      <a href="#contacts">Контакты</a>
    </nav>
    <a class="phone" href="tel:+78462000000">+7 846 200-00-00</a>
  </header>

  <main class="page">
    <h1 id="tours">Ближайшие туры</h1>
    <p id="status" class="status"></p>
    <div id="list" class="list"></div>

    <section id="booking" class="booking">
      <h2>Заявка на тур</h2>
      <form class="form">
        <label>Имя <input id="name" type="text"></label>
        <label>Телефон <input id="phone" type="text"></label>
        <label>Электронная почта <input id="email" type="text"></label>
        <label>Сколько человек <input id="people" type="text"></label>
        <button type="submit" class="button">Отправить</button>
      </form>
    </section>
  </main>

  <footer id="contacts" class="footer">
    Турбюро «Компас», г. Самара, ул. Ленинградская, 1
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
