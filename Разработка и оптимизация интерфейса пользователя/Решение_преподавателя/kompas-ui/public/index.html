<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Компас — каталог туров</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">КОМПАС <span>туры по России</span></div>
  </header>

  <main class="page">
    <h1>Каталог туров</h1>

    <!-- Панель фильтров -->
    <div class="filters">
      <input id="search" type="text" placeholder="Поиск по названию">
      <select id="region">
        <option value="">Все регионы</option>
        <option value="Сибирь">Сибирь</option>
        <option value="Поволжье">Поволжье</option>
        <option value="Север">Север</option>
        <option value="Юг">Юг</option>
        <option value="Дальний Восток">Дальний Восток</option>
        <option value="Урал">Урал</option>
      </select>
      <label class="check"><input id="cheap" type="checkbox"> до 20 000 ₽</label>
      <select id="sort">
        <option value="">Без сортировки</option>
        <option value="asc">Сначала дешёвые</option>
        <option value="desc">Сначала дорогие</option>
      </select>
    </div>

    <p id="count" class="count"></p>

    <!-- Сюда JavaScript выведет карточки туров -->
    <div id="list" class="list"></div>
  </main>

  <!-- Наш код. Файл js/app.js вы создадите сами (шаг 2) -->
  <script src="js/app.js"></script>

  <!-- Виджет онлайн-консультанта загружаем, когда страница уже показана -->
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const script = document.createElement('script');
        script.src = 'js/old-widget.js';
        document.body.append(script);
      }, 500);
    });
  </script>
</body>
</html>
